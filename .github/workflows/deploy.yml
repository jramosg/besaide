name: Deploy to VPS

on:
  workflow_run:
    workflows: ['Code Quality Checks']
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  # Skipped commits must not cancel an active deployment.
  group: >-
    deploy-${{
      contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      && github.run_id || github.ref
    }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NGINX_IMAGE_NAME: ${{ github.repository }}-nginx
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-and-push:
    # The branches filter and head_branch also match a fork PR from a
    # branch named "master"; require a push to this repository so fork
    # code is never built, pushed to GHCR or deployed.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'master' &&
        !contains(github.event.workflow_run.head_commit.message, '[skip deploy]')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      node_image_tag: ${{ steps.node-meta.outputs.tags }}
      nginx_image_tag: ${{ steps.nginx-meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Node service
        id: node-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.DEPLOY_SHA }}
            type=raw,value=latest

      - name: Extract metadata for Nginx service
        id: nginx-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ env.DEPLOY_SHA }}
            type=raw,value=latest

      - name: Build and push Node image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.node-meta.outputs.tags }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Build and push Nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6
        with:
          context: .
          file: ./Dockerfile.nginx
          build-contexts: |
            app=docker-image://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.DEPLOY_SHA }}
          push: true
          tags: ${{ steps.nginx-meta.outputs.tags }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Deploy through the restricted CI gate
        # The key can only run `deploy besaide <sha>` on the server, which
        # pulls the public sha-tagged images. Compose and .env there are
        # admin-managed (see vps-ops/ci-deploy).
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEmoaMAZ9yKpppVl6J2NPsXsirLII1K5/FR47keXM215
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "vps $HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o HostKeyAlias=vps \
            -o StrictHostKeyChecking=yes "ci@$VPS_HOST" \
            deploy besaide "$DEPLOY_SHA" < /dev/null

      - name: Verify site
        run: curl -fsS --retry 5 --retry-delay 3 -o /dev/null https://besaide.eus/
