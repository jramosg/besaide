name: Dependabot auto-merge

# master has no required status checks: Keystatic writers and the image
# optimizer push to it directly, and GitHub Actions cannot bypass rules on
# a personal repository. So instead of GitHub's auto-merge, wait for Code
# Quality Checks to pass on the Dependabot PR and merge it from here.
on:
  workflow_run:
    workflows: ['Code Quality Checks']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge patch updates after checks pass
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Merge if every bumped dependency is a patch update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          pr=$(gh pr list -R "$REPO" --head "$HEAD_BRANCH" --state open \
                 --json number,headRefOid \
                 -q ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")
          if [ -z "$pr" ]; then
            echo "No open PR at the checked commit; nothing to merge."
            exit 0
          fi
          # Dependabot lists each update in the commit message, e.g.
          # "update-type: version-update:semver-patch".
          types=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message |
                    sed -n 's/^ *update-type: *//p' | sort -u)
          echo "Update types: ${types:-none}"
          if [ "$types" != 'version-update:semver-patch' ]; then
            echo "Not patch-only; leaving PR #$pr for review."
            exit 0
          fi
          gh pr merge "$pr" -R "$REPO" --squash --match-head-commit "$HEAD_SHA"
