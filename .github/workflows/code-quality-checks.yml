name: Code Quality Checks

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  format-check:
    name: Run Prettier, TypeScript checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run format:check
        run: pnpm run format:check

      - name: Run check
        run: pnpm run check --minimumFailingSeverity hint

      - name: Run tests
        run: pnpm test
